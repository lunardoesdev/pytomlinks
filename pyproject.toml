[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "tomlinks.VERSION"}

[project]
name = "tomlinks"
dynamic = ["version"]
description = "Transactional dotfile and configuration manager"
readme = "readme.md"
requires-python = ">=3.7"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: BSD",
    "Operating System :: MacOS",
]

[project.scripts]
tomlinks = "tomlinks:main"

[tool.setuptools]
py-modules = ["tomlinks"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/yourusername/pytomlinks"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]

